[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genropy-kajenn"
version = "0.1.0"
description = "Daemon-less commander/worker model serving genropy legacy sites on top of kajenn and kajenn-orchestra"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Genropy Team", email = "info@softwell.it"}
]
keywords = ["asgi", "genropy", "commander", "worker", "sticky", "reverse-proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: AsyncIO",
]

dependencies = [
    "kajenn>=0.1.0",
    "kajenn-orchestra>=0.1.0",
]

[project.optional-dependencies]
portal = ["psycopg[binary]>=3.2,<4"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",
]
dev = [
    "genropy-kajenn[test]",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=1.0",
]

[project.scripts]
gnrkajenn = "genropy_kajenn.spa.cli:main"

# The daemonless register: the legacy `gnr.web.daemon` switcher imports the module
# named here and installs it as `gnr.web.daemon`, so `SiteRegisterClient` and friends
# resolve to genropy_kajenn.siteregister — no register daemon. Replaces genro-nodaemon.
[project.entry-points."gnr.web"]
daemon = "genropy_kajenn.siteregister"

[project.urls]
Homepage = "https://github.com/genropy/genropy-kajenn"
Repository = "https://github.com/genropy/genropy-kajenn"
"Bug Tracker" = "https://github.com/genropy/genropy-kajenn/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/genropy_kajenn"]
exclude = ["**/tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=genropy_kajenn --cov-report=term-missing --cov-report=html --cov-report=xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

# Freeze the historical default rule set: ruff 0.16 widened its defaults
# (isort, naming, RUF/UP families), some of which collide with deliberate
# idioms here. Adopting new rules is a per-rule decision, not a side effect
# of whatever version CI happens to install.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
exclude = ["tests/", ".*/tests/"]

# The bridge's registry and worker read register rows the core hands back as
# ``dict | None`` (``Register.get``): a missing row is a KeyError the verbs raise
# on purpose, not a None to branch on. The worker also reaches its own additions
# through attributes the core types on the base class (``request_slot`` is a
# ``RequestSlot``, ``registry`` a ``RegisterRegistry``): ``GenropyRequestSlot``
# and ``GenropyRegistry`` are what actually live there (``build_request_slot``,
# ``build_registry``). Silenced per category, never in code (mypy policy).
[[tool.mypy.overrides]]
module = "genropy_kajenn.spa.genropy_register"
disable_error_code = ["index"]

[[tool.mypy.overrides]]
module = "genropy_kajenn.spa.genropy_worker"
disable_error_code = ["index", "attr-defined", "arg-type"]
