server {
    listen 80;
    server_name kajenn.genropy.net;
    location /.well-known/acme-challenge/ { root /var/www/kajenn-acme; }
    location / { return 301 https://kajenn.genropy.net$request_uri; }
}
server {
    listen 443 ssl;
    server_name kajenn.genropy.net;
    ssl_certificate /etc/letsencrypt/live/kajenn.genropy.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kajenn.genropy.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ~ ^/(?:$|benchmarks(?:/|$)|api/benchmarks(?:/|$)|docs(?:/|$)|internals(?:/|$)|health$) {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:19080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
