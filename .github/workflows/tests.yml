name: Tests

"on":
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff (Linux/glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          # genropy is imported at runtime and is not a declared dependency:
          # the bridge hosts a site the operator already has. The tests need it.
          pip install genropy
          pip install ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Tests
        run: pytest tests/
